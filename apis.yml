aid: withai
name: WithAI
description: WithAI is a San Francisco-based Y Combinator (Spring 2026) company building
  Multiplier, a secure AI platform for institutional investors and independent equity
  hedge funds. Multiplier unifies structured data, unstructured data, AI agents, human
  work, and firm knowledge so investment teams can research stocks and manage portfolios
  more efficiently, with an integration ecosystem spanning Bloomberg, FactSet, Enfusion,
  Snowflake, and other market data and infrastructure platforms. WithAI does not currently
  publish a public API, developer portal, or documentation.
